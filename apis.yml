name: LogicNow
description: 'LogicNow (styled LOGICnow) was a global provider of integrated, cloud-based
  IT service management (ITSM) software for managed service providers (MSPs), best known
  for its MAX product suite — MAX Remote Management (RMM), MAX Backup & Disaster Recovery,
  MAX Mail, MAX Risk Intelligence and MAX Service Desk. On June 1, 2016 LOGICnow was
  acquired by SolarWinds and merged with SolarWinds N-able to form SolarWinds MSP, later
  spun out as the independent public company N-able. LogicNow no longer operates as an
  independent entity: its logicnow.com domain no longer serves a website (NXDOMAIN, MX
  only, handled by n-able.com) and it publishes no independent developer or API surface.'
